# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Edge Router

on:
  push:
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: ./edgerouter/go.sum

      # go-sqlite3 needs cgo; Go turns cgo off when cross-compiling unless a C cross-compiler is set
      - name: Install arm64 C cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build edgerouter
        working-directory: ./edgerouter/
        env:
          CGO_ENABLED: '1'
        run: |
          GOARCH=amd64 go build -o ../images/edgerouter/edgerouter-amd64
          GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -o ../images/edgerouter/edgerouter-arm64
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/subject-control'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: images/edgerouter
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/team-aivn/edgerouter
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/subject-control' }}
